<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>No Outside Drinks</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@page{size:8.5in 11in;margin:0}
html,body{width:8.5in;height:11in;overflow:hidden;background:#fff;color:#111;font-family:'Outfit',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0.7in 0.6in 0.85in;border:0.18in solid #111}
.logo{width:4.6in;margin-top:0.2in}
.icon{width:2.6in;height:2.6in}
h1{font-family:'Bebas Neue',sans-serif;font-size:128px;line-height:0.88;text-align:center;letter-spacing:3px}
p{font-size:27px;font-weight:500;text-align:center;line-height:1.3}
p strong{font-weight:700}
</style></head><body><div class="page">
<img class="logo" src="babylon-kino-logo.png" alt="Babylon Kino">
<svg class="icon" viewBox="0 0 200 200" aria-hidden="true">
  <!-- cup -->
  <path d="M62 52 H138 L128 168 Q127 176 119 176 H81 Q73 176 72 168 Z" fill="none" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
  <line x1="56" y1="52" x2="144" y2="52" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <path d="M104 52 L114 22 L134 18" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- prohibition -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#d6141c" stroke-width="16"/>
  <line x1="36" y1="36" x2="164" y2="164" stroke="#d6141c" stroke-width="16"/>
</svg>
<h1>No Outside<br>Drinks</h1>
<p>Please support the bar &mdash; only drinks<br>bought here may be enjoyed on the premises.<br><strong>Thank you!</strong></p>
</div></body></html>
