<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KJ Remote</title>
    <style>
        body { font-family: sans-serif; background-color: #282c34; color: #abb2bf; }
        .container { background-color: #353a42; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h2 { color: #61afef; border-bottom: 2px solid #61afef; padding-bottom: 0.5rem; margin-top: 0; }
        input[type="text"], input[type="url"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #4f5661; background-color: #2c313a; color: #abb2bf; }
        button { background-color: #61afef; color: #282c34; border: none; padding: 12px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #529bdf; }
        .button-group button { margin-right: 10px; }
        .log-entry { padding: 2px 0; border-bottom: 1px solid #353a42; }
        .log-entry.error { color: #e06c75; }
        .log-entry.success { color: #98c379; }
        .hidden { display: none; }
        #media-list { list-style-type: none; padding: 0; border: 1px solid #4f5661; border-radius: 4px; }
        #media-list li { padding: 10px; cursor: pointer; border-bottom: 1px solid #4f5661; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.2s; }
        #media-list li:last-child { border-bottom: none; }
        #media-list li:hover { background-color: #4f5661; }
        #media-list li.playing { background-color: #98c379; color: #282c34; }
        #media-list li.folder-header { background-color: #2c313a; color: #61afef; font-weight: bold; cursor: pointer; user-select: none; font-size: 0.85em; padding: 6px 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        #media-list li.folder-header:hover { background-color: #3a3f47; }
        .folder-chevron { display: inline-block; transition: transform 0.15s; margin-right: 0.5rem; font-size: 0.75em; }
        .folder-chevron.expanded { transform: rotate(90deg); }
        .folder-items.collapsed { display: none; }
        .folder-items li { padding: 10px; cursor: pointer; border-bottom: 1px solid #4f5661; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.2s; }
        .folder-items li:last-child { border-bottom: none; }
        .folder-items li:hover { background-color: #4f5661; }
        .folder-items li.playing { background-color: #98c379; color: #282c34; }
        .folder-controls { display: flex; gap: 0.25rem; margin-bottom: 0.5rem; }
        .folder-btn { font-size: 0.75em; padding: 4px 10px; background-color: #4f5661; }
        .folder-btn:hover { background-color: #5c6370; }
        .delete-btn { background-color: #e06c75; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background-color: #d15c66; }
        .rescan-btn { background-color: #98c379; font-size: 0.8em; padding: 6px 12px; margin-left: 10px; }
        .rescan-btn:hover { background-color: #7daa62; }
        .rescan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .volume-slider { width: 100%; }
        .channel-tag { color: #c678dd; font-size: 0.85em; margin-left: 4px; }
        .media-count { color: #5c6370; font-size: 0.8em; font-weight: normal; margin-left: 8px; }

        /* Compact Layout Styles */
        body {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 1rem;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "col1 col2"
                "footer footer";
            gap: 1rem;
            height: calc(100vh - 4rem);
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
        }
        .container {
            margin: 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .available-songs {
            flex-grow: 1;
            min-height: 0;
        }
        #media-list {
            flex-grow: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .footer-area {
            grid-area: footer;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            max-height: 200px;
        }
        #status-bar, #log-area {
            padding: 1rem;
            background-color: #2c313a;
            border-radius: 4px;
        }
        #audio-warning {
            display: none;
            background-color: #e74c3c;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            text-align: center;
            grid-column: 1 / -1;
        }
        #audio-warning button {
            background: white;
            color: #e74c3c;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            margin-left: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        #log-area {
            height: auto;
            max-height: 200px;
            overflow-y: scroll;
            font-family: monospace;
            font-size: 0.9em;
        }
        .header-row { display: flex; align-items: center; justify-content: space-between; }
        .header-row h2 { flex-grow: 1; margin-bottom: 0; }

        /* Search UI */
        .search-box { position: relative; margin-bottom: 8px; }
        .search-box input { width: calc(100% - 22px); padding: 10px; border-radius: 4px; border: 1px solid #4f5661; background-color: #2c313a; color: #abb2bf; font-size: 0.95em; }
        .search-box input::placeholder { color: #5c6370; }
        .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #5c6370; cursor: pointer; font-size: 1.2em; padding: 4px 8px; }
        .search-clear:hover { color: #abb2bf; }
        .search-meta { font-size: 0.8em; color: #5c6370; margin-bottom: 4px; }
        .search-meta a { color: #61afef; cursor: pointer; text-decoration: none; }
        .search-meta a:hover { text-decoration: underline; }
        .format-badge { font-size: 0.75em; padding: 2px 6px; border-radius: 3px; margin-left: 6px; font-weight: bold; }
        .format-badge.zip { background-color: #e5c07b; color: #282c34; }
        .format-badge.mp4 { background-color: #61afef; color: #282c34; }
        .format-badge.other { background-color: #5c6370; color: #abb2bf; }
        .artist-name { color: #c678dd; }
        .catalog-detail { display: flex; flex-direction: column; gap: 2px; }
        .catalog-folder { font-size: 0.75em; color: #5c6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .section-header { background-color: #2c313a; color: #5c6370; font-size: 0.8em; padding: 6px 10px; text-transform: uppercase; letter-spacing: 0.5px; cursor: default; }
        .section-header:hover { background-color: #2c313a; }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="column" id="col1">
            <div class="container">
                <h2>Download Song</h2>
                <input type="url" id="youtube-url" placeholder="Enter YouTube URL" onkeyup="if(event.keyCode === 13) downloadSong()">
                <button id="download-btn" onclick="downloadSong()">Download</button>
                <div id="download-status" class="hidden" style="margin-top: 10px;">Downloading... please wait.</div>
            </div>
            <div class="container">
                <h2>Playback Controls</h2>
                <div class="button-group">
                    <button onclick="controlPlayback('pause_resume')">Pause / Resume</button>
                    <button onclick="controlPlayback('restart')">Restart</button>
                    <button onclick="controlPlayback('stop')">Stop & Play Music</button>
                </div>
                <div style="margin-top: 1rem;">
                    <label for="seek-slider">Seek: <span id="seek-value">0:00</span></label>
                    <input type="range" id="seek-slider" class="volume-slider" min="0" max="1" value="0" step="0.001" onchange="seekVideo(this.value)" oninput="updateSeekLabel(this.value)">
                </div>
                <div style="margin-top: 1rem;">
                    <label for="karaoke-volume">Karaoke Volume:</label>
                    <input type="range" id="karaoke-volume" class="volume-slider" min="0" max="256" value="200" oninput="setVolume('karaoke', this.value)">
                </div>
                <div style="margin-top: 1rem;">
                    <label for="filler-volume">Filler Music Volume:</label>
                    <input type="range" id="filler-volume" class="volume-slider" min="0" max="256" value="100" oninput="setVolume('filler', this.value)">
                </div>
                <div style="margin-top: 1rem;">
                    <label for="filler-selector">Filler Music:</label>
                    <select id="filler-selector" onchange="setFillerMusic(this.value)" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #4f5661; background-color: #2c313a; color: #abb2bf;"></select>
                </div>
                <div style="margin-top: 1rem;">
                    <label for="audio-device">Audio Output:</label>
                    <select id="audio-device" onchange="setAudioDevice(this.value)" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #4f5661; background-color: #2c313a; color: #abb2bf;"></select>
                </div>
            </div>
        </div>

        <div class="column" id="col2">
            <div class="container available-songs">
                <div class="header-row">
                    <h2>Available Songs<span id="media-count" class="media-count"></span></h2>
                    <button class="rescan-btn" id="rescan-btn" onclick="rescanMedia()">Rescan Media</button>
                </div>
                <div class="search-box">
                    <input type="text" id="catalog-search" placeholder="Search your library and catalog..." autocomplete="off">
                    <button class="search-clear hidden" id="search-clear" onclick="clearSearch()">&times;</button>
                </div>
                <div id="search-meta" class="search-meta hidden"></div>
                <div id="folder-controls" class="folder-controls hidden">
                    <button class="folder-btn" onclick="expandAll()">Expand All</button>
                    <button class="folder-btn" onclick="collapseAll()">Collapse All</button>
                </div>
                <ul id="media-list">
                    <li>Loading media...</li>
                </ul>
            </div>
        </div>

        <div class="footer-area">
            <div id="audio-warning">
                Audio device issue detected - playback may be silent.
                <button onclick="fixAudio()">Fix Audio</button>
            </div>
            <div id="status-bar">
                <strong>Status:</strong> <span id="player-state">Unknown</span> |
                <strong>Playing:</strong> <span id="current-video">None</span> |
                <strong>Filler:</strong> <span id="current-filler">wii.mp3</span> |
                <strong>Time:</strong> <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </div>
            <div id="log-area"></div>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('log-area');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.prepend(entry);
        }

        async function apiCall(endpoint, body) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                if (!response.ok) {
                    let errorMessage = data.error || 'API request failed';
                    if (data.vlc_status) {
                        errorMessage += ` | VLC Status: ${JSON.stringify(data.vlc_status)}`;
                    }
                    throw new Error(errorMessage);
                }
                return data;
            } catch (error) {
                log(`API Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function downloadSong() {
            const urlInput = document.getElementById('youtube-url');
            const downloadBtn = document.getElementById('download-btn');
            const downloadStatus = document.getElementById('download-status');
            const url = urlInput.value;
            if (!url) {
                log('Please enter a YouTube URL.', 'error');
                return;
            }
            log(`Downloading: ${url}`);
            downloadBtn.disabled = true;
            downloadStatus.classList.remove('hidden');
            const data = await apiCall('/download', { url });
            downloadBtn.disabled = false;
            downloadStatus.classList.add('hidden');
            if (data && data.success) {
                log(`Downloaded "${data.title}" successfully!`, 'success');
                urlInput.value = '';
                await updateMediaList();
            }
        }

        async function playMedia(filePath) {
            if (!filePath) {
                log('Cannot play: file path is missing.', 'error');
                return;
            }
            const filename = filePath.split('/').pop();
            log(`Playing: ${filename}`);
            await apiCall('/play', { file_path: filePath });
        }

        async function deleteMedia(filePath, displayName) {
            if (!confirm(`Are you sure you want to delete "${displayName}"?`)) {
                return;
            }
            log(`Deleting: ${displayName}`);
            const data = await apiCall('/delete', { file_path: filePath });
            if (data && data.success) {
                log(`Successfully deleted "${displayName}"`, 'success');
                await updateMediaList();
            }
        }

        async function rescanMedia() {
            const btn = document.getElementById('rescan-btn');
            btn.disabled = true;
            btn.textContent = 'Scanning...';
            log('Rescanning media folders...');
            const data = await apiCall('/rescan', {});
            btn.disabled = false;
            btn.textContent = 'Rescan Media';
            if (data && data.success) {
                log(`Rescan complete: ${data.count} files found.`, 'success');
                await updateMediaList();
            }
        }

        async function fixAudio() {
            log('Restarting VLC instances to fix audio...');
            const data = await apiCall('/fix_audio', {});
            if (data && data.success) {
                log('Audio fix applied - VLC instances restarted.', 'success');
            }
        }

        async function controlPlayback(action) {
            log(`Sending control: ${action}`);
            await apiCall('/control', { action });
        }

        async function setVolume(target, level) {
            log(`Setting ${target} volume to ${level}`);
            await apiCall('/volume', { target, level: parseInt(level) });
        }

        async function setAudioDevice(device) {
            log(`Switching audio device to: ${device}`);
            await apiCall('/audio_device', { device });
        }

        let totalVideoLength = 0;
        let isSeeking = false;

        function updateSeekLabel(position) {
            if (totalVideoLength > 0) {
                const seekTime = parseFloat(position) * totalVideoLength;
                document.getElementById('seek-value').textContent = formatTime(seekTime);
            }
        }

        async function seekVideo(position) {
            if (totalVideoLength > 0) {
                const seekTime = parseFloat(position) * totalVideoLength;
                log(`Seeking to ${formatTime(seekTime)}`);
                await apiCall('/seek', { time: seekTime });
            }
        }

        async function setFillerMusic(trackName) {
            log(`Setting filler music to: ${trackName}`);
            await apiCall('/filler_music', { track_name: trackName });
        }

        async function updateFillerMusicList() {
            try {
                const response = await fetch('/filler_music');
                const tracks = await response.json();
                const selector = document.getElementById('filler-selector');
                selector.innerHTML = '';
                tracks.forEach(track => {
                    const option = document.createElement('option');
                    option.value = track;
                    option.textContent = track;
                    selector.appendChild(option);
                });
            } catch (error) {
                log('Could not update filler music list.', 'error');
            }
        }

        let localMediaItems = [];

        function loadFolderStates() {
            try {
                return JSON.parse(localStorage.getItem('kj-folder-state') || '{}');
            } catch { return {}; }
        }

        function saveFolderStates(states) {
            localStorage.setItem('kj-folder-state', JSON.stringify(states));
        }

        function toggleFolder(folderName) {
            const escapedName = CSS.escape(folderName);
            const container = document.getElementById('folder-' + escapedName);
            const chevron = document.getElementById('chevron-' + escapedName);
            if (!container) return;
            const isCollapsed = container.classList.toggle('collapsed');
            chevron.classList.toggle('expanded', !isCollapsed);
            const states = loadFolderStates();
            states[folderName] = !isCollapsed;
            saveFolderStates(states);
        }

        function expandAll() {
            document.querySelectorAll('.folder-items').forEach(el => el.classList.remove('collapsed'));
            document.querySelectorAll('.folder-chevron').forEach(el => el.classList.add('expanded'));
            const states = {};
            document.querySelectorAll('.folder-items').forEach(el => {
                states[el.dataset.folder] = true;
            });
            saveFolderStates(states);
        }

        function collapseAll() {
            document.querySelectorAll('.folder-items').forEach(el => el.classList.add('collapsed'));
            document.querySelectorAll('.folder-chevron').forEach(el => el.classList.remove('expanded'));
            const states = {};
            document.querySelectorAll('.folder-items').forEach(el => {
                states[el.dataset.folder] = false;
            });
            saveFolderStates(states);
        }

        function createMediaItemLi(item) {
            const li = document.createElement('li');

            const titleSpan = document.createElement('span');
            if (item.channel) {
                const channelSpan = document.createElement('span');
                channelSpan.className = 'channel-tag';
                channelSpan.textContent = `(${item.channel})`;
                titleSpan.textContent = item.display_name + ' ';
                titleSpan.appendChild(channelSpan);
            } else {
                titleSpan.textContent = item.display_name;
            }

            const rightSide = document.createElement('span');
            if (item.is_download) {
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'delete-btn';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteMedia(item.file_path, item.display_name);
                };
                rightSide.appendChild(deleteBtn);
            }

            li.appendChild(titleSpan);
            li.appendChild(rightSide);
            li.onclick = () => {
                document.querySelectorAll('#media-list li').forEach(el => el.classList.remove('playing'));
                li.classList.add('playing');
                playMedia(item.file_path);
            };
            return li;
        }

        function renderFolderView(items) {
            const mediaList = document.getElementById('media-list');
            const mediaCount = document.getElementById('media-count');
            const folderControls = document.getElementById('folder-controls');
            mediaList.innerHTML = '';

            if (items.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No media files found. Try downloading a song or clicking Rescan.';
                li.style.cursor = 'default';
                mediaList.appendChild(li);
                mediaCount.textContent = '';
                folderControls.classList.add('hidden');
                return;
            }

            mediaCount.textContent = `(${items.length})`;

            const groups = {};
            items.forEach(item => {
                const folder = item.folder_name || 'Unknown';
                if (!groups[folder]) groups[folder] = [];
                groups[folder].push(item);
            });

            const folderNames = Object.keys(groups).sort();
            const showHeaders = folderNames.length > 1;
            folderControls.classList.toggle('hidden', !showHeaders);

            const savedStates = loadFolderStates();

            folderNames.forEach(folderName => {
                if (showHeaders) {
                    const isExpanded = savedStates[folderName] !== undefined ? savedStates[folderName] : false;

                    const header = document.createElement('li');
                    header.className = 'folder-header';
                    header.onclick = () => toggleFolder(folderName);

                    const chevron = document.createElement('span');
                    chevron.className = 'folder-chevron' + (isExpanded ? ' expanded' : '');
                    chevron.id = 'chevron-' + CSS.escape(folderName);
                    chevron.textContent = '▶';

                    header.appendChild(chevron);
                    header.appendChild(document.createTextNode(`${folderName} (${groups[folderName].length})`));
                    mediaList.appendChild(header);

                    const wrapper = document.createElement('li');
                    wrapper.style.cssText = 'padding:0; border-bottom:none; display:block;';
                    const container = document.createElement('ul');
                    container.style.cssText = 'list-style:none; padding:0; margin:0;';
                    container.className = 'folder-items' + (isExpanded ? '' : ' collapsed');
                    container.id = 'folder-' + CSS.escape(folderName);
                    container.dataset.folder = folderName;

                    groups[folderName].forEach(item => {
                        container.appendChild(createMediaItemLi(item));
                    });
                    wrapper.appendChild(container);
                    mediaList.appendChild(wrapper);
                } else {
                    groups[folderName].forEach(item => {
                        mediaList.appendChild(createMediaItemLi(item));
                    });
                }
            });
        }

        async function updateMediaList() {
            if (searchActive) return;
            try {
                const response = await fetch('/media');
                localMediaItems = await response.json();
                renderFolderView(localMediaItems);
            } catch (error) {
                log('Could not update media list.', 'error');
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${min}:${sec}`;
        }

        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('player-state').textContent = data.state || 'unknown';
                    document.getElementById('current-video').textContent = data.current_playing || 'None';
                    document.getElementById('current-filler').textContent = data.current_filler_track || 'None';
                    document.getElementById('current-time').textContent = formatTime(data.time);
                    document.getElementById('total-time').textContent = formatTime(data.length);

                    // Show/hide audio warning
                    const audioWarning = document.getElementById('audio-warning');
                    audioWarning.style.display = data.audio_error ? 'block' : 'none';

                    // Sync audio device dropdown with server state
                    if (data.audio_device) {
                        const deviceSelect = document.getElementById('audio-device');
                        if (deviceSelect.value !== data.audio_device) {
                            deviceSelect.value = data.audio_device;
                        }
                    }

                    totalVideoLength = data.length || 0;
                    const seekSlider = document.getElementById('seek-slider');
                    if (!isSeeking) {
                        if (totalVideoLength > 0) {
                            seekSlider.value = data.time / totalVideoLength;
                            updateSeekLabel(seekSlider.value);
                        } else {
                            seekSlider.value = 0;
                            updateSeekLabel(0);
                        }
                    }
                }
            } catch (error) {
                // Don't log periodic status check errors to avoid clutter
            }
        }

        async function loadAudioDevices() {
            try {
                const response = await fetch('/audio_device');
                const data = await response.json();
                const selector = document.getElementById('audio-device');
                selector.innerHTML = '';
                for (const [key, label] of Object.entries(data.available)) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = label;
                    if (key === data.current) option.selected = true;
                    selector.appendChild(option);
                }
            } catch (error) {
                log('Could not load audio devices.', 'error');
            }
        }

        // --- Catalog Search ---
        let searchActive = false;
        let searchDebounceTimer = null;

        function getFormatBadgeClass(format) {
            if (format === 'cdg+mp3') return 'zip';
            if (format === 'mp4') return 'mp4';
            return 'other';
        }

        function filterLocalMedia(query) {
            const terms = query.toLowerCase().split(/\s+/).filter(t => t);
            return localMediaItems.filter(item => {
                const text = ((item.display_name || '') + ' ' + (item.channel || '')).toLowerCase();
                return terms.every(term => text.includes(term));
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderUnifiedResults(localResults, catalogResults, query) {
            const mediaList = document.getElementById('media-list');
            const mediaCount = document.getElementById('media-count');
            const searchMeta = document.getElementById('search-meta');
            const folderControls = document.getElementById('folder-controls');
            mediaList.innerHTML = '';
            folderControls.classList.add('hidden');

            const safeQuery = escapeHtml(query);
            const totalCount = localResults.length + catalogResults.length;
            searchMeta.classList.remove('hidden');
            if (totalCount === 0) {
                searchMeta.innerHTML = `No results for "<strong>${safeQuery}</strong>". <a onclick="clearSearch()">Clear search</a>`;
                mediaCount.textContent = '';
                return;
            }

            const parts = [];
            if (localResults.length > 0) parts.push(`${localResults.length} local`);
            if (catalogResults.length > 0) parts.push(`${catalogResults.length} catalog`);
            searchMeta.innerHTML = `${parts.join(' + ')} result${totalCount !== 1 ? 's' : ''} for "<strong>${safeQuery}</strong>" <a onclick="clearSearch()">Clear</a>`;
            mediaCount.textContent = `(${totalCount})`;

            // Local results first
            if (localResults.length > 0) {
                if (catalogResults.length > 0) {
                    const sectionHeader = document.createElement('li');
                    sectionHeader.className = 'section-header';
                    sectionHeader.textContent = `Your Library (${localResults.length})`;
                    mediaList.appendChild(sectionHeader);
                }
                localResults.forEach(item => {
                    mediaList.appendChild(createMediaItemLi(item));
                });
            }

            // Catalog results
            if (catalogResults.length > 0) {
                if (localResults.length > 0) {
                    const sectionHeader = document.createElement('li');
                    sectionHeader.className = 'section-header';
                    sectionHeader.textContent = `Catalog (${catalogResults.length})`;
                    mediaList.appendChild(sectionHeader);
                }
                catalogResults.forEach(item => {
                    const li = document.createElement('li');
                    const detail = document.createElement('div');
                    detail.className = 'catalog-detail';

                    const titleRow = document.createElement('span');
                    // Show full filename with format badge
                    const nameText = item.filename.replace(/\.\w+$/, '');
                    titleRow.textContent = nameText + ' ';
                    const badge = document.createElement('span');
                    badge.className = `format-badge ${getFormatBadgeClass(item.format)}`;
                    badge.textContent = item.format;
                    titleRow.appendChild(badge);
                    detail.appendChild(titleRow);

                    // Show folder path (strip common mount prefix for brevity)
                    if (item.folder) {
                        const folderSpan = document.createElement('div');
                        folderSpan.className = 'catalog-folder';
                        let folderDisplay = item.folder;
                        // Strip common prefixes to show meaningful path
                        folderDisplay = folderDisplay.replace(/^\/mnt\/[^/]+\//, '');
                        folderDisplay = folderDisplay.replace(/^\/Volumes\/[^/]+\//, '');
                        folderSpan.textContent = folderDisplay;
                        folderSpan.title = item.folder;
                        detail.appendChild(folderSpan);
                    }

                    li.appendChild(detail);
                    li.onclick = () => {
                        document.querySelectorAll('#media-list li').forEach(el => el.classList.remove('playing'));
                        li.classList.add('playing');
                        playMedia(item.path);
                    };
                    mediaList.appendChild(li);
                });
            }
        }

        async function catalogSearch(query) {
            if (!query || query.length < 2) {
                if (searchActive) clearSearch();
                return;
            }
            searchActive = true;
            document.getElementById('search-clear').classList.remove('hidden');

            // Client-side: filter local media instantly
            const localResults = filterLocalMedia(query);

            // Show local results immediately while catalog loads
            renderUnifiedResults(localResults, [], query);

            // Server-side: fetch catalog results
            let catalogResults = [];
            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}&limit=50`);
                if (response.ok) {
                    catalogResults = await response.json();
                }
            } catch (error) {
                // Catalog unavailable, show local results only
            }

            // Re-render with both result sets (if still on same search)
            if (searchActive && document.getElementById('catalog-search').value.trim() === query) {
                renderUnifiedResults(localResults, catalogResults, query);
            }
        }

        function clearSearch() {
            searchActive = false;
            document.getElementById('catalog-search').value = '';
            document.getElementById('search-clear').classList.add('hidden');
            document.getElementById('search-meta').classList.add('hidden');
            renderFolderView(localMediaItems);
        }

        async function checkCatalogAvailability() {
            try {
                const response = await fetch('/catalog/stats');
                const data = await response.json();
                const searchInput = document.getElementById('catalog-search');
                if (data.available) {
                    searchInput.placeholder = `Search your library + ${data.total.toLocaleString()} catalog songs...`;
                } else {
                    searchInput.placeholder = 'Search your library...';
                }
            } catch (error) {
                // Catalog not available - local search still works
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const seekSlider = document.getElementById('seek-slider');
            seekSlider.addEventListener('mousedown', () => { isSeeking = true; });
            seekSlider.addEventListener('mouseup', () => { isSeeking = false; });
            seekSlider.addEventListener('touchstart', () => { isSeeking = true; });
            seekSlider.addEventListener('touchend', () => { isSeeking = false; });

            // Debounced catalog search
            const searchInput = document.getElementById('catalog-search');
            searchInput.addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    catalogSearch(searchInput.value.trim());
                }, 300);
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') clearSearch();
            });

            updateStatus();
            updateMediaList();
            updateFillerMusicList();
            loadAudioDevices();
            checkCatalogAvailability();
            log('KJ Remote initialized.');
        });

        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
