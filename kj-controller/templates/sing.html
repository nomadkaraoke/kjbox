<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nomad Karaoke — Request a song</title>
<link rel="icon" href="{{ url_for('sing.static', filename='favicon.ico') }}">
<link rel="stylesheet" href="{{ url_for('sing.static', filename='sing.css') }}">
{% if not closed %}
<link rel="manifest" href="{{ url_for('sing.manifest') }}?t={{ token }}">
<meta name="theme-color" content="#ff4dcf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nomad">
<link rel="apple-touch-icon" href="{{ url_for('sing.static', filename='icon-192.png') }}">
{% if vapid_public_key %}
<meta name="vapid-public-key" content="{{ vapid_public_key }}">
{% endif %}
{% endif %}
</head>
<body class="sing">
<div id="sing-offline" class="offline-banner" hidden>
  No internet — keep this page open and we'll update when we're back.
</div>
{% if closed %}
<main class="sing-card sing-closed">
  <h1>Requests aren't open right now</h1>
  <p>The KJ hasn't started a new event, or has paused requests. Please ask them.</p>
</main>
{% else %}
<div id="sing-root"
     data-token="{{ token }}"
     data-request-id="{{ request_id }}">
</div>
<script type="module" src="{{ url_for('sing.static', filename='sing.js') }}"></script>
{% endif %}
</body>
</html>
