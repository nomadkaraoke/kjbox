[project]
name = "night-clips"
version = "0.1.0"
description = "Turn a Thursday night's phone clips into a reviewed Instagram carousel draft (kjbox, Mac only)"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[project.scripts]
night-clips = "nightclips.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightclips"]

[tool.pytest.ini_options]
testpaths = ["tests"]
